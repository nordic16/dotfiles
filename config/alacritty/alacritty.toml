[general]
import = [
    "colors.toml"
]

[font]
size = 12.0

[font.bold]
family = "CaskaydiaCoveNerdFont"
style = "Bold"

[font.normal]
family = "CaskaydiaCoveNerdFont"
style = "Regular"

[font.bold_italic]
family = "CaskaydiaCoveNerdFont"
style = "Bold Italic"

[font.italic]
family = "CaskaydiaCoveNerdFont"
style = "Italic"

[window]
opacity = 0.7
padding.x = 16
padding.y = 16
decorations = "Full"

[cursor]
style = { shape="Underline", blinking="Always" }
blink_interval = 500
thickness = 0.3
unfocused_hollow = false
